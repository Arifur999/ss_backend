# Serves the whole app from ONE origin: the SPA at / and the Express API at
# /api/. Same origin means the browser never makes a cross-site request, so
# there is no CORS preflight on any call - one less round trip every time.
#
# HTTPS is live (Let's Encrypt, issued for furnify.softech.agency). Port 80
# keeps answering so renewals can complete, but serves nothing else - every
# other request is sent to HTTPS.
#
# www.furnify.softech.agency is listed on the TLS block so it works the moment
# a DNS record and a certificate exist for it. Neither does yet, so that name
# is currently unreachable rather than broken.

# Named upstream purely so `keepalive` can be set. Without it nginx opens a
# fresh TCP connection to Express for every single API call, and a dashboard
# fires several at once - that is a handshake each, on top of the query.
upstream backend_app {
    server backend:5000;
    keepalive 32;
}

# Don't advertise the exact nginx version in every response and on error pages.
server_tokens off;

# Anything arriving on port 80 for a host we do not serve - scanners hitting the
# raw IP, or a request with a forged Host header - is dropped here.
#
# Without this the block below is the implicit default server, so ANY Host
# matched it and `return 301 https://$host...` would happily send the visitor to
# whatever domain the header named. 444 closes the connection with no response.
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    server_name furnify.softech.agency www.furnify.softech.agency;

    # Certbot's renewal challenge. This has to stay ABOVE the redirect, or
    # renewals start failing silently in 90 days.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        # $host is safe here now: the catch-all above means only the two names
        # on server_name can reach this block.
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name furnify.softech.agency www.furnify.softech.agency;

    ssl_certificate     /etc/letsencrypt/live/furnify.softech.agency/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/furnify.softech.agency/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    # Forward-secret suites only. Without an explicit list nginx falls back to a
    # default that still permits TLS 1.2 suites without forward secrecy, so a
    # future leak of the private key would expose past traffic. TLS 1.3 picks
    # its own suites and ignores this line.
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    # Session tickets are encrypted with a key that only rotates when nginx
    # restarts; with a 1-day timeout that is a long window in which one stolen
    # key decrypts past sessions. The session cache above still gives resumption.
    ssl_session_tickets off;

    # --- Security headers ---------------------------------------------------
    # `always` so they are sent on error responses too.
    #
    # Note for anyone editing below: nginx DISCARDS inherited add_header
    # directives inside any location that declares its own. Three locations here
    # set Cache-Control, so these four lines are repeated in each of them. If a
    # new location adds a header, it has to repeat these as well.
    #
    # HSTS without includeSubDomains or preload on purpose: it commits only this
    # hostname, and only for six months, so nothing else on the domain is
    # affected and the commitment is reversible.
    add_header Strict-Transport-Security "max-age=15768000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Product images and other uploads (nginx default is only 1m).
    client_max_body_size 20m;

    # Compress text on the way out. The app bundle alone goes from ~1.6 MB to
    # roughly 420 KB, which on a phone connection is most of the wait before
    # the first screen appears. text/html is always compressed and must not be
    # listed here. gzip_vary keeps caches from handing a compressed body to a
    # client that cannot read one.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    location /api/ {
        proxy_pass http://backend_app/api/;
        proxy_http_version 1.1;
        # Both lines are needed for the upstream keepalive pool to be used:
        # HTTP/1.1 above, and clearing the inherited "Connection: close" here.
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The default read timeout is 60s, which the yearly/monthly report
        # endpoints can exceed on a large account and turn into a 504.
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
    }

    root /usr/share/nginx/html;
    index index.html;

    # Asset filenames carry a content hash, so they can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Repeated because this location declares add_header - see the note by
        # the server-level headers above.
        add_header Strict-Transport-Security "max-age=15768000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Images and fonts that sit at the root of dist/ rather than under
    # /assets/ - the login and register photos are the ones that matter. They
    # have no content hash, so they cannot be immutable, but without this they
    # fall through to the block below and get "no-cache", which means ~350 KB
    # revalidated on every visit to the login screen.
    location ~* \.(?:jpg|jpeg|png|gif|svg|webp|avif|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
        add_header Strict-Transport-Security "max-age=15768000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        access_log off;
    }

    # try_files falls back to index.html so React Router paths
    # (/products, /super-admin/owners, ...) survive a hard refresh.
    location / {
        try_files $uri $uri/ /index.html;
        # index.html lists which hashed assets to load, so a stale copy points
        # the browser at a build that no longer exists. Revalidate every time.
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=15768000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
