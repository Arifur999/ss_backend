# Serves the whole app from ONE origin: the SPA at / and the Express API at
# /api/. Same origin means the browser never makes a cross-site request, so
# there is no CORS preflight on any call - one less round trip every time.
#
# HTTPS is live (Let's Encrypt, issued for cosmeticdentalbranding.com and
# www). Port 80 keeps answering so renewals can complete, but serves nothing
# else - every other request is sent to HTTPS.

server {
    listen 80;
    server_name cosmeticdentalbranding.com www.cosmeticdentalbranding.com;

    # Certbot's renewal challenge. This has to stay ABOVE the redirect, or
    # renewals start failing silently in 90 days.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name cosmeticdentalbranding.com www.cosmeticdentalbranding.com;

    ssl_certificate     /etc/letsencrypt/live/cosmeticdentalbranding.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cosmeticdentalbranding.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Product images and other uploads (nginx default is only 1m).
    client_max_body_size 20m;

    location /api/ {
        proxy_pass http://backend:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    root /usr/share/nginx/html;
    index index.html;

    # Asset filenames carry a content hash, so they can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # try_files falls back to index.html so React Router paths
    # (/products, /super-admin/owners, ...) survive a hard refresh.
    location / {
        try_files $uri $uri/ /index.html;
        # index.html lists which hashed assets to load, so a stale copy points
        # the browser at a build that no longer exists. Revalidate every time.
        add_header Cache-Control "no-cache";
    }
}
