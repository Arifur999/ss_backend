# Serves the whole app from ONE origin: the SPA at / and the Express API at
# /api/. Same origin means the browser never makes a cross-site request, so
# there is no CORS preflight on any call - one less round trip every time.
#
# Phase 1 (this file as shipped) is HTTP only. Nginx must be reachable on
# port 80 for certbot's HTTP-01 challenge, so do NOT add an HTTPS server block
# pointing at cert files before those certs exist - nginx would refuse to start
# at all. Once `certbot certonly` succeeds, uncomment Phase 2 below and
# `docker compose restart nginx`.

server {
    listen 80;
    server_name cosmeticdentalbranding.com www.cosmeticdentalbranding.com;

    # Required for certbot to issue/renew. Keep this ABOVE any HTTP->HTTPS
    # redirect, or renewals start failing silently in 90 days.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # ---- Phase 2: uncomment to force HTTPS once certs exist ----
    # location / { return 301 https://$host$request_uri; }

    # Product images and other uploads (nginx default is only 1m).
    client_max_body_size 20m;

    location /api/ {
        proxy_pass http://backend:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    root /usr/share/nginx/html;
    index index.html;

    # Asset filenames carry a content hash, so they can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # try_files falls back to index.html so React Router paths
    # (/products, /super-admin/owners, ...) survive a hard refresh.
    location / {
        try_files $uri $uri/ /index.html;
        # index.html lists which hashed assets to load, so a stale copy points
        # the browser at a build that no longer exists. Revalidate every time.
        add_header Cache-Control "no-cache";
    }
}

