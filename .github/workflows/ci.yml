name: CI

# Quality gate: runs on every push to main and on every pull request into
# main. A red check here means don't merge/deploy - it catches type errors,
# lint errors, and (via the Docker build step) a broken Dockerfile before any
# of that reaches the server.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # --legacy-peer-deps: multer-storage-cloudinary@4 peers on cloudinary@^1.21,
      # this project uses cloudinary@2.x.
      - run: npm ci --legacy-peer-deps

      # The Prisma client is generated TypeScript source (src/generated/prisma) -
      # tsc needs it to exist before it can type-check anything that imports it.
      - run: npx prisma generate

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint . --ext .ts

      # listQuery.test.ts pins down the server half of what a search means -
      # a literal contains with LIKE's wildcards escaped - so it keeps
      # agreeing with the browser's rules rather than drifting into SQL's.
      - name: Tests
        run: npm test

      - name: Build (compiles TypeScript)
        run: npm run build

      - name: Build Docker image
        run: docker build -t backend-ci-check .

  # Ships to the VPS only after quality-check is green, and only for pushes to
  # main (never for pull requests). `needs` is what enforces that order - a red
  # check leaves the server untouched.
  deploy:
    needs: quality-check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # One deploy at a time; a newer push waits rather than racing an older one
    # mid-rebuild.
    concurrency:
      group: deploy-backend
      cancel-in-progress: false
    steps:
      - name: Authorise SSH to the VPS
        run: |
          mkdir -p ~/.ssh
          # tr -d '\r': a key copied on Windows carries CRLF line endings, and
          # OpenSSH rejects the file outright - before opening any connection,
          # so the server logs nothing and the failure looks like a network
          # problem further down.
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Pinning the host key stops a man-in-the-middle from receiving the
          # deploy; VPS_SSH_KNOWN_HOSTS comes from `ssh-keyscan <host>`.
          printf '%s\n' "${{ secrets.VPS_SSH_KNOWN_HOSTS }}" | tr -d '\r' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          # Say so here, plainly, rather than failing later with something that
          # reads like the server is unreachable.
          ssh-keygen -y -P "" -f ~/.ssh/id_ed25519 > /dev/null 2>&1 \
            || { echo "::error::VPS_SSH_KEY is not a usable private key. Copy it again in full, including the -----BEGIN and -----END lines."; exit 1; }

      # Rebuilds the backend image and restarts it. The container itself runs
      # `prisma migrate deploy` on start, so schema changes apply here too.
      - name: Pull and restart the stack
        run: |
          ssh -i ~/.ssh/id_ed25519 -p "${{ secrets.VPS_SSH_PORT || 22 }}" \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            'set -e
             cd ${{ secrets.VPS_APP_DIR }}/hatim_Backend
             git fetch --all
             git reset --hard origin/main
             docker compose up -d --build
             # nginx.conf is bind-mounted as a single file, which Docker binds
             # by inode. git reset replaces the file rather than editing it, so
             # the running container keeps reading the old one and a config
             # change appears to deploy while doing nothing at all. Recreating
             # the container is what re-resolves the mount.
             #
             # The check has to run BEFORE that recreate, and in a throwaway
             # container: `exec nginx -t` in the running one would only re-read
             # the old inode, and checking after the recreate means a broken
             # config takes the site down first and fails the deploy second.
             # `run --rm --no-deps` starts a fresh container, so it picks up the
             # new file, with the same cert volumes mounted that `nginx -t`
             # needs to resolve ssl_certificate. set -e aborts here on failure,
             # leaving the live nginx untouched.
             docker compose run --rm --no-deps nginx nginx -t
             docker compose up -d --force-recreate nginx
             docker image prune -f'

      # Asked over the public address, the same way a customer reaches it, so
      # DNS, the certificate, nginx and the container all have to be working
      # for this to pass. (Not localhost: port 80 there only redirects now.)
      - name: Verify the API answers
        run: |
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w "%{http_code}" https://furnify.softech.agency/api/v1/auth/me || true)
            # 401 is the healthy answer here: the route exists and is guarded.
            if [ "$code" = "401" ]; then echo "API is up (HTTP $code)"; exit 0; fi
            echo "waiting for the API... (got $code)"; sleep 10
          done
          echo "API did not come up - check: docker compose logs backend"
          exit 1
