# Production stack for the furniture business app: postgres + backend (this
# repo, built from ./Dockerfile) + nginx (reverse proxy + static frontend
# server). Run this from a server where hatim_Backend and Hatim are cloned
# as SIBLING folders - nginx serves ../Hatim/dist directly, no separate
# frontend container/build step needed since it's a plain static SPA.
#
# All secrets, including POSTGRES_USER/POSTGRES_PASSWORD/POSTGRES_DB below,
# go in the .env file already in this folder (gitignored). Docker Compose
# auto-loads it both for ${VAR} substitution here AND (via env_file below)
# to inject the app's own runtime env vars into the backend container - one
# file, two uses. Make sure DATABASE_URL in .env matches whatever you set
# POSTGRES_USER/PASSWORD/DB to, with host "postgres" (the service name
# below), not "localhost".

# Docker keeps container logs forever by default, and a crash loop writing to
# stderr can quietly fill the disk until the whole site stops. Capping every
# service at 3 x 10 MB bounds that.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-furniture_business}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Postgres ships with settings sized for a very small machine: 128 MB of
    # cache and 4 MB of working memory, on a server with 7.8 GB sitting idle.
    # Every list query was therefore reading from disk that the OS had already
    # cached, and sorts spilled to temp files far sooner than they needed to.
    #
    #   shared_buffers        - Postgres's own cache. A quarter of RAM is the
    #                           usual starting point.
    #   effective_cache_size  - not an allocation; it tells the planner how
    #                           much the OS is likely caching, which is what
    #                           makes it choose an index over a table scan.
    #   work_mem              - per sort/hash. Multiplied by concurrent
    #                           operations, so kept well under the total.
    #   random_page_cost      - 4 assumes spinning disks; this is an SSD, and
    #                           leaving it high tells the planner to avoid the
    #                           very indexes added for these queries.
    command:
      - postgres
      - -c
      - shared_buffers=1GB
      - -c
      - effective_cache_size=4GB
      - -c
      - work_mem=32MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Not published to the host on purpose - only the backend container
    # (over the internal compose network) can reach it.

  backend:
    build: .
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    # Internal only - nginx is what the outside world talks to.
    expose:
      - "5000"
    # Lets nginx wait for a backend that is actually answering rather than one
    # that has merely started. node's own fetch is used so the image needs no
    # curl/wget. start_period covers `prisma migrate deploy`, which runs before
    # the server listens (see Dockerfile CMD).
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../Hatim/dist:/usr/share/nginx/html:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    # service_healthy, not a bare dependency: nginx starting while the backend
    # is still migrating is what serves 502s during a deploy.
    depends_on:
      backend:
        condition: service_healthy

  # Not started by `docker compose up` (no other service depends on it) -
  # only runs on demand, e.g.:
  #   docker compose run --rm certbot certonly --webroot -w /var/www/certbot \
  #     -d yourdomain.com -d www.yourdomain.com --email you@example.com --agree-tos
  # Using the service name (not a guessed volume name) means this always
  # shares the exact same certbot_www/certbot_certs volumes as nginx above,
  # regardless of what Docker Compose ends up prefixing them with.
  certbot:
    image: certbot/certbot
    profiles: ["certbot"]
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt

volumes:
  postgres_data:
  certbot_www:
  certbot_certs:
